apiVersion: apps/v1
kind: Deployment
metadata:
  name: employees-deploy
  namespace: employees
spec:
  replicas: 3
  selector:
    matchLabels:
      app: employees
  template:
    metadata:
      labels:
        app: employees
    spec:
      imagePullSecrets:
      - name: ecr-pull-secret
      containers:
      - name: employees
        image: <ECR_WEB_URI>:v2b
        ports:
        - containerPort: 8080
        env:
        - name: DBHOST
          value: "mysql-svc-clusterip.mysql.svc.cluster.local"
        - name: DBPORT
          value: "3306"
        - name: DBUSER
          value: "root"
        - name: DBPWD
          value: "pw"
        - name: DATABASE
          value: "employees"
        - name: APP_COLOR
          value: "green"
